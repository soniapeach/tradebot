# fly.toml app configuration file generated for tradebot-windblown-stream-1436 on 2026-05-10T21:06:18+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tradebot-windblown-stream-1436'
primary_region = 'cdg'

[build]

[env]
  MAX_DAILY_LOSS_PCT = '5'
  MAX_POSITION_USDT = '50'
  PAPER_TRADING = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[services]]
  protocol = ''
  internal_port = 0
  ports = []

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
